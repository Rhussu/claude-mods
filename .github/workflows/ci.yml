name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The Claude Code version the mods are tested with. Bump it in its own PR.
  CLAUDE_CODE_VERSION: 2.1.314

jobs:
  validate-and-test:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate and test each mod and the template
        run: |
          status=0
          for mod in mods/*/ templates/*/; do
            echo "::group::${mod}"
            claude plugin validate "$mod" || status=1
            claude plugin test "$mod" || status=1
            echo "::endgroup::"
          done
          exit $status

  version-bump:
    name: Version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed mods have a new version and changelog
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          status=0
          for dir in mods/*/; do
            mod=$(basename "$dir")
            version=$(jq -r .version "$dir/.claude-plugin/plugin.json")
            listed=$(jq -r --arg m "$mod" '.plugins[] | select(.name == $m) | .version' .claude-plugin/marketplace.json)
            if [ "$listed" != "$version" ]; then
              echo "::error::$mod: plugin.json says $version, marketplace.json says ${listed:-nothing}"
              status=1
            fi
            # Only pull requests are compared with their base.
            [ "${{ github.event_name }}" = "pull_request" ] || continue
            # Only the README and images changed: no new version needed.
            if git diff --quiet "$BASE" HEAD -- "$dir" ":(exclude)$dir*.md" ":(exclude)${dir}assets"; then continue; fi
            before=$(git show "$BASE:$dir.claude-plugin/plugin.json" 2>/dev/null | jq -r .version || true)
            if [ -n "$before" ] && [ "$before" = "$version" ]; then
              echo "::error::$mod changed but its version is still $version: bump it in plugin.json and marketplace.json"
              status=1
            fi
            if ! grep -q "## \[$version\]" "$dir/CHANGELOG.md"; then
              echo "::error::$mod: CHANGELOG.md has no entry for $version"
              status=1
            fi
          done
          exit $status

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
